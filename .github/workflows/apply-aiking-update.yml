      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Test build (nothing is pushed if this fails)
        run: gradle assembleDebug --no-daemon

      - name: Commit to main
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add app/src
          git diff --cached --quiet || git commit -m "Password gate, unlimited voices, ad before floating toggle, real ads"
          git push origin HEAD:main

      - name: Start APK release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main

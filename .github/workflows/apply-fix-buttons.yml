          if [ "${{ steps.s4.outcome }}" = "success" ]; then
            git add app/src
            git diff --cached --quiet || git commit -m "Show the state of all six ads"
            git push origin HEAD:main
          else
            git checkout -- app/src
            git clean -fdq app/src
          fi

      - name: Start APK release build
        if: steps.s1.outcome == 'success' || steps.s2.outcome == 'success' || steps.s3.outcome == 'success' || steps.s4.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main

      - name: Show red mark if a part failed
        if: steps.s1.outcome != 'success' || steps.s2.outcome != 'success' || steps.s3.outcome != 'success' || steps.s4.outcome != 'success'
        run: |
          echo "Part 1 result: ${{ steps.s1.outcome }}"
          echo "Part 2 result: ${{ steps.s2.outcome }}"
          echo "Part 3 result: ${{ steps.s3.outcome }}"
          echo "Part 4 result: ${{ steps.s4.outcome }}"
          exit 1

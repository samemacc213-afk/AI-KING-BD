      - name: "Part 1: save or undo"
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          if [ "${{ steps.s1.outcome }}" = "success" ]; then
            git add app/src
            git diff --cached --quiet || git commit -m "Crash reporter: shows why the app closed"

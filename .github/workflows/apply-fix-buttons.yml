      - name: "Part 3: save or undo"
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          if [ "${{ steps.s3.outcome }}" = "success" ]; then
            git add app/src
            git diff --cached --quiet || git commit -m "Four switches for floating buttons, stacked together"
            git push origin HEAD:main
          else
            git checkout -- app/src
            git clean -fdq app/src
          fi


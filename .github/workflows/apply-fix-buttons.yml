      - name: "Part 2: save or undo"
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          if [ "${{ steps.s2.outcome }}" = "success" ]; then
            git add app/src
            git diff --cached --quiet || git commit -m "Voice recording runs in a safe service, no more freezing"
            git push origin HEAD:main
          else
            git checkout -- app/src
            git clean -fdq app/src
          fi


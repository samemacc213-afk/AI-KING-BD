      - name: "Part 1: save or undo"
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          if [ "${{ steps.s1.outcome }}" = "success" ]; then
            git add app/src
            git diff --cached --quiet || git commit -m "All six ad types, password gate, unlimited voices"
            git push origin HEAD:main
          else
            git checkout -- app/src
            git clean -fdq app/src
          fi


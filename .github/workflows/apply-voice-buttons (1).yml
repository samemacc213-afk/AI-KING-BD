      - name: "Part 2: save or undo"
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          if [ "${{ steps.s2.outcome }}" = "success" ]; then
            git add app/src
            git diff --cached --quiet || git commit -m "Two voice buttons: record, then Bengali text copied"
            git push origin HEAD:main
          else
            git checkout -- app/src
            git clean -fdq app/src
          fi

      - name: Start APK release build
        if: steps.s1.outcome == 'success' || steps.s2.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main

      - name: Show red mark if a part failed
        if: steps.s1.outcome != 'success' || steps.s2.outcome != 'success'
        run: |
          echo "Part 1 result: ${{ steps.s1.outcome }}"
          echo "Part 2 result: ${{ steps.s2.outcome }}"
          exit 1
